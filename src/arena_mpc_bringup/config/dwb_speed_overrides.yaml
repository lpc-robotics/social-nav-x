# Optional DWB speed profile. This file is merged after Arena's unchanged
# controller configuration so the effective controller and smoother limits
# agree without editing the stable underlay.
controller_server:
  ros__parameters:
    FollowPath:
      max_vel_x: 0.8
      max_vel_theta: 1.5
      max_speed_xy: 0.8

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.8, 0.0, 1.5]
    min_velocity: [-0.8, 0.0, -1.5]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
