hunav_loader:
  ros__parameters:
    map: formal_social_warehouse
    publish_people: true
    agents:
      - formal_human

    formal_human:
      id: 1
      skin: 0
      group_id: -1
      max_vel: 0.6
      radius: 0.4
      behavior:
        type: 1
        configuration: 1
        duration: 40.0
        once: true
        vel: 0.6
        dist: 0.0
        goal_force_factor: 2.0
        obstacle_force_factor: 10.0
        social_force_factor: 5.0
        other_force_factor: 20.0
      # Remain at the initial goal while Regular and keep the robot inside the
      # visible FOV without facing it exactly.  This makes the formal acceptance
      # velocities the only source of approach motion while allowing the
      # Surprised response to prove a real yaw change toward the robot.
      init_pose: {x: 6.0, y: 3.0, z: 0.0, h: 2.4}
      goal_radius: 0.3
      cyclic_goals: true
      goals: [g0]
      g0: {x: 6.0, y: 3.0, h: 2.4}

arena_hunav_isaac_bridge:
  ros__parameters:
    update_rate: 40.0
    # Keep headroom above the 4.5 Hz acceptance floor.  The original six-human
    # YAML remains untouched at 5 Hz; this setting applies only to the isolated
    # one-human formal demo.
    display_rate: 6.0
    max_integration_step: 0.025
    scheduler_rate: 100.0
    character_models:
      - original_female_adult_business_02
