hunav_loader:
  ros__parameters:
    map: isaac_six_behaviors_warehouse
    publish_people: true
    agents:
      - regular
      - impassive
      - surprised
      - scared
      - curious
      - threatening

    # All six use custom configuration (1), so no random parameter rewrite is
    # performed by hunav_loader. Behavior values are the HuNav v1 warehouse
    # defaults, plus the official warehouse custom values for Curious. The
    # four special behaviors repeat while the robot remains visible so the
    # reactions can be inspected more than once in an interactive demo.
    regular:
      id: 1
      skin: 0
      group_id: -1
      max_vel: 1.5
      radius: 0.4
      behavior:
        type: 1
        configuration: 1
        duration: 40.0
        once: true
        vel: 0.6
        dist: 0.0
        goal_force_factor: 2.0
        obstacle_force_factor: 10.0
        social_force_factor: 5.0
        other_force_factor: 20.0
      init_pose: {x: 15.0, y: 12.0, z: 0.0, h: 3.1415926536}
      goal_radius: 0.3
      cyclic_goals: true
      goals: [g0, g1]
      g0: {x: 5.0, y: 12.0, h: 0.0}
      g1: {x: 15.0, y: 12.0, h: 0.0}

    impassive:
      id: 2
      skin: 4
      group_id: -1
      max_vel: 1.5
      radius: 0.4
      behavior:
        type: 2
        configuration: 1
        duration: 40.0
        once: true
        vel: 0.6
        dist: 0.0
        goal_force_factor: 2.0
        obstacle_force_factor: 10.0
        social_force_factor: 5.0
        other_force_factor: 20.0
      init_pose: {x: 5.0, y: 10.0, z: 0.0, h: 0.0}
      goal_radius: 0.3
      cyclic_goals: true
      goals: [g0, g1]
      g0: {x: 15.0, y: 10.0, h: 0.0}
      g1: {x: 5.0, y: 10.0, h: 0.0}

    surprised:
      id: 3
      skin: 2
      group_id: -1
      max_vel: 1.5
      radius: 0.4
      behavior:
        type: 3
        configuration: 1
        duration: 30.0
        once: false
        vel: 0.6
        dist: 4.0
        goal_force_factor: 2.0
        obstacle_force_factor: 10.0
        social_force_factor: 5.0
        other_force_factor: 20.0
      init_pose: {x: 6.5, y: 4.5, z: 0.0, h: 3.1415926536}
      goal_radius: 0.3
      cyclic_goals: true
      goals: [g0, g1]
      # A fixed northbound lane which does not cross the robot at (3, 3).
      g0: {x: 6.5, y: 8.5, h: 0.0}
      g1: {x: 6.5, y: 4.5, h: 0.0}

    scared:
      id: 4
      skin: 0
      group_id: -1
      max_vel: 1.5
      radius: 0.4
      behavior:
        type: 4
        configuration: 1
        duration: 40.0
        once: false
        vel: 0.6
        dist: 3.0
        goal_force_factor: 2.0
        obstacle_force_factor: 10.0
        social_force_factor: 5.0
        other_force_factor: 20.0
      init_pose: {x: 4.5, y: 5.0, z: 0.0, h: -2.2142974356}
      goal_radius: 0.3
      cyclic_goals: true
      goals: [g0, g1]
      # The waypoint heads away from the robot instead of through its center.
      g0: {x: 1.5, y: 8.0, h: 0.0}
      g1: {x: 4.5, y: 5.0, h: 0.0}

    curious:
      id: 5
      skin: 3
      group_id: -1
      max_vel: 1.5
      radius: 0.4
      behavior:
        type: 5
        configuration: 1
        duration: 30.0
        once: false
        vel: 0.8
        dist: 1.5
        goal_force_factor: 2.0
        obstacle_force_factor: 10.0
        social_force_factor: 5.0
        other_force_factor: 20.0
      # Approach from the north-west, away from Threatening's front target.
      init_pose: {x: 1.0, y: 8.0, z: 0.0, h: -1.5707963268}
      goal_radius: 0.3
      cyclic_goals: true
      goals: [g0, g1]
      # The southbound fallback brings the robot into view without crossing it.
      g0: {x: 1.0, y: 4.0, h: 0.0}
      g1: {x: 1.0, y: 8.0, h: 0.0}

    threatening:
      id: 6
      skin: 5
      group_id: -1
      max_vel: 1.5
      radius: 0.4
      behavior:
        type: 6
        configuration: 1
        duration: 40.0
        once: false
        vel: 0.6
        dist: 1.4
        goal_force_factor: 2.0
        obstacle_force_factor: 10.0
        social_force_factor: 5.0
        other_force_factor: 20.0
      # Start on the robot's +X axis so the transition to the dynamic front
      # target cannot cut diagonally through the robot collision envelope.
      init_pose: {x: 6.0, y: 3.0, z: 0.0, h: 3.1415926536}
      goal_radius: 0.3
      cyclic_goals: true
      goals: [g0, g1]
      # The fallback lane remains entirely east of the robot.
      g0: {x: 10.0, y: 3.0, h: 0.0}
      g1: {x: 6.0, y: 3.0, h: 0.0}

arena_hunav_isaac_bridge:
  ros__parameters:
    # HuNav integrates independently from the slower Isaac Character display.
    # Isaac currently runs at roughly 0.35 real-time factor. A 40 Hz simulated
    # integration cadence yields about 14 Hz wall-clock HuNav updates.
    update_rate: 40.0
    display_rate: 5.0
    max_integration_step: 0.025
    scheduler_rate: 100.0
    character_models:
      - original_female_adult_business_02
      - original_female_adult_medical_01
      - original_male_adult_medical_01
      - original_male_adult_construction_01
      - original_male_adult_construction_05
      - original_female_adult_police_01
